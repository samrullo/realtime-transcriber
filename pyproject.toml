[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "realtime-transcriber"
version = "0.1.0"
description = "Realtime audio transcription pipeline"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "sounddevice",
  "webrtcvad",
  "faster-whisper",
  "fastapi",
  "uvicorn[standard]",
  "python-dotenv"
]

[project.scripts]
rt-transcriber = "realtime_transcriber.cli:main"
